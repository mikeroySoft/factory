<!doctype html>
<html lang="en" data-theme="factory">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Factory Workspace</title>
  <script>
    (() => {
      const allowed = new Set(['cyberpunk','gpuflo','district','factory','rocm','porcelain','sandstone','slate','forest']);
      let theme = 'factory';
      try { theme = localStorage.getItem('factory-theme') || theme; } catch {}
      document.documentElement.dataset.theme = allowed.has(theme) ? theme : 'factory';
    })();
  </script>
  <link rel="stylesheet" href="/themes.css">
  <link rel="stylesheet" href="/workspace.css">
  <link rel="stylesheet" href="/workspace-codebase.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="app" aria-busy="true"></div>
  <div id="overlay"></div>
  <div id="live-status" class="sr-only" role="status" aria-live="polite"></div>
  <script src="/motion.js"></script>
  <script src="/workspace-api.js"></script>
  <script src="/workspace-settings.js"></script>
  <script src="/workspace-codebase.js"></script>
  <script src="/workspace-tools.js"></script>
  <script src="/workspace-decisions.js"></script>
  <script src="/workspace.js"></script>
</body>
</html>
