# Written by `factory init`. The merge stage refuses to land a PR that has no
# passing GitHub check, so this workflow must exist and must pass. Make the
# step below run the same commands as [[gate.check]] in .factory.toml.
name: ci
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install '.[atlas]'
      - run: python scripts/ci_portable.py

  gate:
    needs: macos
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Ruff
        run: uvx ruff@0.16.10 check .
      - run: python -m pip install '.[atlas]'
      - run: python -m unittest discover -s tests
      - name: Require macOS
        if: ${{ always() }}
        env:
          MACOS_RESULT: ${{ needs.macos.result }}
        run: test "$MACOS_RESULT" = success
