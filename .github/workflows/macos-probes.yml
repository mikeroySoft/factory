name: macOS systemd probe compatibility
on: [push, pull_request]
jobs:
  probes:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      # Includes real dashboard --json and doctor --json subprocesses against a
      # fixture repo, with no systemctl/journalctl stubs and no live GitHub reads.
      - run: python -m unittest discover -s tests -p test_systemd_probes.py -v
