# agent-factory configuration. Docs: https://github.com/mikeroySoft/factory
# Gate checks proposed by District from: --check

[gate]
protected_paths = [".factory.toml", "mutation-equivalents.json", "**/acceptance/**", "**/*review*prompt*", "TRACKING*", "**/TRACKING*"]
add_only_paths = ["tests/**"]
# #801: the `test` check hit the 1200 s default on every Ultron attempt; the full suite takes
# about 1750 s there (r3-0620 solo runs, 2177 tests) versus about 600 s on Tank. Applies to every
# check's per-run limit; a check that really hangs is still killed, and budget_min bounds the ticket.
timeout = 3600

[[gate.check]]
name = "test"
run = [
    "uv",
    "run",
    "--frozen",
    "--no-managed-python",
    "python",
    "-m",
    "unittest",
    "discover",
    "-s",
    "tests",
]
exclusive = false

[[gate.check]]
name = "ruff"
run = ["uvx", "ruff@0.16.10", "check", "."]
exclusive = false

# Holds tests/pr_tier/, the test that re-runs the whole suite to catch leaked tempdirs (~10 min).
# Runs once per PR head, not per attempt: tests/pr_tier/ has no __init__.py, so neither the
# `test` check's discovery nor the mutation baseline reaches it. CI runs it too.
[[gate.check]]
name = "test-pr-tier"
run = [
    "uv",
    "run",
    "--frozen",
    "--no-managed-python",
    "python",
    "-m",
    "unittest",
    "discover",
    "-s",
    "tests/pr_tier",
]
exclusive = false
when = "pr"

# Report-only: lists surviving mutants of changed factory/ files for the reviewer; exits
# nonzero only when the tool itself fails to run. Runs once per PR head, not per attempt.
[[gate.check]]
name = "mutation"
run = [
    "uv",
    "run",
    "--frozen",
    "--no-managed-python",
    "--group",
    "mutation",
    "python",
    "scripts/mutation.py",
    "--equivalents",
    "mutation-equivalents.json",
]
exclusive = false
when = "pr"
proof = "mutation-v1"

[dashboard]
theme = ".factory-dashboard.css"

[dispatch]
review_rounds = 3
max_active = 4
# #761: dispatch treats any commit or handoff as "done" and terminates the worker after exit_grace
# seconds of quiet (default 300). "Quiet" watches only the worker's own log, HEAD, `git status` and
# its handoff file (dispatch.py _activity/_watch); the worker's `factory gate` runs as a child whose
# output goes to the worker, not that log, so it never resets the clock. The gate's test check runs
# about 1750 s on Ultron, so working workers were killed as hung_after_done (6 of 9 Ultron attempts,
# plus #731 on Tank). 3600 matches the gate timeout above and is about twice the measured suite time;
# idle_timeout is raised below. The real fix (no exit_grace while the worker has a live child) stays in #761.
exit_grace = 3600
# budget_min is one wall-clock deadline for the whole ticket: worker time plus the dispatcher's own
# gate, across all max_attempts (3). Measured per attempt on Ultron: about 8 min of work, one worker
# gate run (about 29 min) and the dispatcher gate (about 29 min), so 3 x (8 + 29 + 29 + 1) = 202 min;
# 90 min escalated #517 and #609 as "budget" while their gates were still running (#801). Tank's
# suite is about 10 min, so this only loosens the bound there.
budget_min = 210
# Minutes of worker quiet before "stuck"; the quiet clock killed #567 attempts 2 and 3 at 1849 s during gates (#801, #567).
idle_timeout = 90

[release]
auto = true

[manager]
rounds = 4
