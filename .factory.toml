# agent-factory configuration. Docs: https://github.com/mikeroySoft/factory
# Gate checks proposed by District from: --check

[gate]
protected_paths = [".factory.toml", "**/acceptance/**", "**/*review*prompt*", "TRACKING*", "**/TRACKING*"]
add_only_paths = ["tests/**"]

[[gate.check]]
name = "test"
run = [
    "uv",
    "run",
    "--frozen",
    "--no-managed-python",
    "python",
    "-m",
    "unittest",
    "discover",
    "-s",
    "tests",
]
exclusive = false

[[gate.check]]
name = "ruff"
run = ["uvx", "ruff@0.16.10", "check", "."]
exclusive = false

# Report-only: lists surviving mutants of changed factory/ files for the reviewer; exits
# nonzero only when the tool itself fails to run. Runs once per PR head, not per attempt.
[[gate.check]]
name = "mutation"
run = [
    "uv",
    "run",
    "--frozen",
    "--no-managed-python",
    "--group",
    "mutation",
    "python",
    "scripts/mutation.py",
]
exclusive = false
when = "pr"

[dashboard]
theme = ".factory-dashboard.css"

[dispatch]
review_rounds = 3
budget_min = 180  # TEMP for #489 / PR #538 until #564 lands; revert when #489 merges/closes or by Nov 4 8:30 AM PST

[release]
auto = true

[manager]
rounds = 4
