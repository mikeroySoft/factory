# agent-factory configuration. Docs: https://github.com/mikeroySoft/factory
# Gate checks proposed by District from: --check

[gate]
protected_paths = [".factory.toml", "mutation-equivalents.json", "**/acceptance/**", "**/*review*prompt*", "TRACKING*", "**/TRACKING*"]
add_only_paths = ["tests/**"]

[[gate.check]]
name = "test"
run = [
    "uv",
    "run",
    "--frozen",
    "--no-managed-python",
    "python",
    "-m",
    "unittest",
    "discover",
    "-s",
    "tests",
]
exclusive = false

[[gate.check]]
name = "ruff"
run = ["uvx", "ruff@0.16.10", "check", "."]
exclusive = false

# Holds tests/pr_tier/, the test that re-runs the whole suite to catch leaked tempdirs (~10 min).
# Runs once per PR head, not per attempt: tests/pr_tier/ has no __init__.py, so neither the
# `test` check's discovery nor the mutation baseline reaches it. CI runs it too.
[[gate.check]]
name = "test-pr-tier"
run = [
    "uv",
    "run",
    "--frozen",
    "--no-managed-python",
    "python",
    "-m",
    "unittest",
    "discover",
    "-s",
    "tests/pr_tier",
]
exclusive = false
when = "pr"

# Report-only: lists surviving mutants of changed factory/ files for the reviewer; exits
# nonzero only when the tool itself fails to run. Runs once per PR head, not per attempt.
[[gate.check]]
name = "mutation"
run = [
    "uv",
    "run",
    "--frozen",
    "--no-managed-python",
    "--group",
    "mutation",
    "python",
    "scripts/mutation.py",
    "--equivalents",
    "mutation-equivalents.json",
]
exclusive = false
when = "pr"
proof = "mutation-v1"

[dashboard]
theme = ".factory-dashboard.css"

[dispatch]
review_rounds = 3
max_active = 4
# Mitigation for #761. dispatch treats any commit or handoff as "done" and terminates the worker
# after exit_grace seconds of quiet (default 300). Workers run their own `factory gate`, which stays
# quiet for longer than 300 s, so working workers were killed as hung_after_done (6 of 9 Ultron
# attempts, plus #731 on Tank). budget_min still bounds a truly hung worker and idle_timeout is
# unchanged. The real fix (no exit_grace while the worker has a live child) stays in #761; drop this
# override when it lands.
exit_grace = 1800

[release]
auto = true

[manager]
rounds = 4
