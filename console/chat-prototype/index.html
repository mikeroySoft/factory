<!doctype html>
<!-- Throwaway UI study: four layouts for a dedicated Factory Manager chat page, ?variant=A|B|C|D.
     Question: how should conversation, tooling, activity/progress, and past conversations be arranged?
     Sample data and a simulated FM only. No backend, no persistence, nothing is sent anywhere.
     Run from repo root:  python -m http.server 8794 --bind 127.0.0.1
     then open:           http://127.0.0.1:8794/console/chat-prototype/?variant=A -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Factory — Chat (prototype)</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../docs/mikeroysoft.css">
<style>
/* ---------- base ---------- */
html { scroll-behavior: smooth; }
body { margin: 0; min-height: 100dvh; background: var(--surface-page); color: var(--text-primary); font: 13px/1.6 var(--font-mono); -webkit-font-smoothing: antialiased; padding-bottom: 96px; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: transparent; border: 1px solid var(--border-hairline); border-radius: var(--radius-sm); min-height: 44px; padding: 8px 14px; color: var(--text-secondary); transition: background .15s, border-color .15s, color .15s; touch-action: manipulation; }
button:hover:not(:disabled) { border-color: var(--accent); color: var(--text-primary); background: var(--accent-tint); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.sm { min-height: 32px; padding: 4px 10px; font-size: 11px; }
button.ghost { border-color: transparent; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--text-on-accent); font-weight: 600; }
button.primary:hover:not(:disabled) { background: var(--accent-soft); color: var(--text-on-accent); }
button[aria-pressed=true], button[aria-selected=true], [aria-current=page] { color: var(--accent); border-color: var(--accent); background: var(--accent-tint); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
a { color: var(--accent); text-decoration: none; }
.muted { color: var(--text-secondary); }
.faint { color: var(--text-muted); }
.eyebrow { font: var(--type-eyebrow); letter-spacing: .15em; text-transform: uppercase; color: var(--text-secondary); }
code, kbd { font-family: var(--font-mono); font-size: 11px; }
kbd { border: 1px solid var(--border-strong); border-radius: 3px; padding: 0 5px; color: var(--text-secondary); background: var(--surface-inset); }
.led { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--status-idle); margin-right: 7px; vertical-align: 1px; }
.led.ok { background: var(--status-ok); box-shadow: 0 0 8px var(--accent-glow); }
.led.warn { background: var(--status-warn); animation: pulse var(--pulse-period) infinite; }
.led.busy { background: var(--accent); animation: pulse .9s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; padding: 2px 8px; border: 1px solid var(--border-hairline); border-radius: var(--radius-pill); color: var(--text-secondary); white-space: nowrap; }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--stage); }
.chip.stage { --stage: var(--status-idle); }
.stage-pr-open { --stage: var(--stage-pr-open); } .stage-in-flight { --stage: var(--stage-in-flight); } .stage-escalated { --stage: var(--stage-escalated); }
.stage-merged { --stage: var(--stage-merged); } .stage-queued { --stage: var(--stage-queued); } .stage-triage { --stage: var(--stage-triage); }

/* ---------- topbar (mirrors codebase.html sibling page) ---------- */
.topbar { display: grid; grid-template-columns: minmax(210px, 1fr) auto; gap: 12px 32px; align-items: center; padding: 14px clamp(16px, 3vw, 40px); border-bottom: 1px solid var(--border-hairline); background: var(--surface-page); position: sticky; top: 0; z-index: 20; }
.title-row { display: flex; align-items: center; gap: 12px; margin-top: 3px; }
.title-row h1 { margin: 0; font: 700 clamp(20px, 2.6vw, 26px)/1.15 var(--font-mono); letter-spacing: -.02em; }
.nav { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.nav a, .nav span { display: inline-flex; min-height: 40px; align-items: center; padding: 6px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); color: var(--text-secondary); }
.nav a:hover { color: var(--accent); border-color: var(--accent); }
.meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 11px; color: var(--text-secondary); }
.meta strong { color: var(--text-primary); font-weight: 500; }
.progress-line { grid-column: 1 / -1; height: 2px; margin: -6px 0 -8px; background: var(--border-hairline); overflow: hidden; border-radius: 1px; }
.progress-line i { display: block; height: 100%; width: 0; background: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

/* ---------- shared chat pieces ---------- */
.chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.chat-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 14px 20px; border-bottom: 1px solid var(--border-hairline); }
.chat-head h2 { margin: 0; font-size: 14px; font-weight: 500; }
.chat-head .spacer { flex: 1; }
.transcript { flex: 1; min-height: 0; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px; scroll-padding-bottom: 40px; }
.msg { display: grid; gap: 10px; max-width: 860px; }
.msg .who { display: flex; align-items: baseline; gap: 10px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-secondary); }
.msg .who time { letter-spacing: 0; text-transform: none; color: var(--text-muted); }
.msg .who .tools { margin-left: auto; display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
.msg:hover .who .tools, .msg:focus-within .who .tools { opacity: 1; }
.msg .who .tools button { min-height: 26px; padding: 0 8px; font-size: 10px; letter-spacing: 0; text-transform: none; border-color: transparent; }
.msg.user { border-left: 2px solid var(--border-strong); padding-left: 14px; }
.msg.user .body { color: var(--text-primary); white-space: pre-wrap; }
.msg.fm { border-left: 2px solid var(--accent); padding-left: 14px; }
.msg.fm .body { white-space: pre-wrap; line-height: 1.7; }
.msg.fm .who b { color: var(--accent); font-weight: 600; }
.scopes-inline { display: flex; gap: 6px; flex-wrap: wrap; }
.cite { display: inline-flex; align-items: center; min-height: 0; margin: 0 2px; padding: 0 6px; font-size: 11px; line-height: 1.5; border: 1px solid var(--border-hairline); border-radius: var(--radius-xs); color: var(--accent); background: var(--accent-wash); vertical-align: baseline; }
.cite:hover { background: var(--accent-tint-strong); }
.cite.lit { background: var(--accent); color: var(--text-on-accent); border-color: var(--accent); }
.cursor { display: inline-block; width: 7px; height: 14px; background: var(--accent); vertical-align: -2px; margin-left: 2px; animation: pulse .8s steps(2) infinite; }

.trace { display: grid; gap: 4px; font-size: 11px; color: var(--text-secondary); border: 1px solid var(--border-hairline); border-radius: var(--radius-md); background: var(--surface-sunken); padding: 10px 12px; overflow: hidden; }
.trace .row { display: flex; align-items: center; gap: 10px; min-height: 22px; }
.trace .row i { width: 8px; height: 8px; border-radius: 50%; flex: none; border: 1px solid var(--border-strong); }
.trace .row.done i { background: var(--status-ok); border-color: var(--status-ok); }
.trace .row.live i { background: var(--accent); border-color: var(--accent); animation: pulse .8s infinite; }
.trace .row.live { color: var(--text-primary); }
.trace .row .ms { margin-left: auto; color: var(--text-muted); }
.trace summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; color: var(--text-secondary); }
.trace summary::-webkit-details-marker { display: none; }
.trace summary .sum { color: var(--text-primary); }
.trace summary::after { content: '+'; margin-left: auto; color: var(--text-muted); }
.trace[open] summary::after { content: '−'; }
.trace[open] summary { margin-bottom: 6px; }
.spinner { width: 14px; height: 14px; flex: none; border: 2px solid var(--border-strong); border-top-color: var(--accent); border-right-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.card { border: 1px solid var(--border-hairline); border-radius: var(--radius-md); background: var(--surface-panel); padding: 12px 14px; display: grid; gap: 8px; }
.card .ct { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card .ct b { font-weight: 600; color: var(--text-primary); }
.card .ct .n { color: var(--accent); font-weight: 600; }
.card .ct .spacer { flex: 1; }
.card p { margin: 0; color: var(--text-secondary); font-size: 12px; }
.card .stages { display: flex; gap: 0; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); position: relative; margin: 6px 0 2px; }
.card .stages span { flex: 1; display: grid; gap: 6px; justify-items: center; }
.card .stages i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--border-strong); background: var(--surface-panel); z-index: 1; }
.card .stages::before { content: ''; position: absolute; left: 10%; right: 10%; top: 4px; height: 1px; background: var(--border-strong); }
.card .stages .done i { background: var(--status-ok); border-color: var(--status-ok); }
.card .stages .done { color: var(--text-secondary); }
.card .stages .cur i { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
.card .stages .cur { color: var(--accent); }
.card .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.proposal { border-color: var(--accent); background: var(--accent-wash); }
.proposal .cmd { font-size: 11px; color: var(--text-primary); background: var(--surface-terminal); padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-hairline); white-space: pre-wrap; }
.proposal .risk { font-size: 11px; }
.proposal .risk b { color: var(--status-ok); font-weight: 500; }
.receipt { border-left: 3px solid var(--status-warn); padding: 8px 12px; background: var(--surface-sunken); font-size: 12px; color: var(--text-secondary); }
.source { border: 1px solid var(--border-hairline); border-left: 3px solid var(--accent); border-radius: var(--radius-sm); background: var(--surface-sunken); padding: 10px 12px; display: grid; gap: 6px; font-size: 12px; }
.source .sl { display: flex; gap: 10px; align-items: baseline; }
.source .sl b { color: var(--accent); font-weight: 600; }
.source pre { margin: 0; font-size: 11px; color: var(--text-secondary); white-space: pre-wrap; max-height: 160px; overflow: auto; }
.sources { display: grid; gap: 8px; }

.quick { display: flex; gap: 8px; flex-wrap: wrap; }
.quick button { font-size: 12px; min-height: 36px; border-radius: var(--radius-pill); }
.composer { border-top: 1px solid var(--border-hairline); padding: 12px 20px 16px; display: grid; gap: 8px; background: var(--surface-page); position: relative; }
.composer .scopes { display: flex; gap: 6px; flex-wrap: wrap; min-height: 0; }
.composer .scopes:empty { display: none; }
.composer .scopes .chip button { min-height: 0; padding: 0 2px; border: 0; color: var(--text-muted); }
.composer .box { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--surface-sunken); padding: 8px 8px 8px 12px; transition: border-color .15s, box-shadow .15s; }
.composer .box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
.composer textarea { width: 100%; min-height: 44px; max-height: 200px; resize: none; border: 0; background: transparent; padding: 10px 0; line-height: 1.5; color: var(--text-primary); }
.composer textarea:focus { outline: none; }
.composer .toolrow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 11px; color: var(--text-muted); }
.composer .toolrow .spacer { flex: 1; }
.composer .status { font-size: 11px; color: var(--text-secondary); min-height: 18px; display: flex; align-items: center; gap: 8px; }
.menu { position: absolute; left: 20px; right: 20px; bottom: calc(100% - 4px); background: var(--surface-inset); border: 1px solid var(--border-strong); border-radius: var(--radius-md); box-shadow: 0 12px 40px #0009; padding: 6px; display: grid; gap: 2px; z-index: 30; max-height: 280px; overflow: auto; }
.menu button { min-height: 36px; border: 0; text-align: left; display: flex; gap: 12px; justify-content: space-between; align-items: center; font-size: 12px; }
.menu button small { color: var(--text-muted); }
.menu button[aria-selected=true] { background: var(--accent-tint-strong); color: var(--text-primary); }
.menu .mh { padding: 6px 10px 2px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); }

/* ---------- history list (A rail, B palette, D drawer share this) ---------- */
.hist { display: grid; gap: 2px; }
.hist .hh { padding: 12px 10px 4px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); }
.hist button { border: 0; text-align: left; display: grid; gap: 4px; padding: 8px 10px; min-height: 0; border-radius: var(--radius-sm); }
.hist button .ht { color: var(--text-primary); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hist button .hm { display: flex; gap: 8px; align-items: center; font-size: 10px; color: var(--text-muted); }
.hist button[aria-current=page] { background: var(--accent-tint); border-left: 2px solid var(--accent); }
.hist button[aria-current=page] .ht { color: var(--accent); }
.search { width: 100%; background: var(--surface-sunken); border: 1px solid var(--border-hairline); border-radius: var(--radius-sm); padding: 8px 10px; color: var(--text-primary); min-height: 40px; }
.search:focus { outline: none; border-color: var(--accent); }

/* ---------- variant A · console ---------- */
.va { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; height: calc(100dvh - var(--top) - 96px); }
.slide { overflow: hidden; flex: none; min-width: 0; }
.slide[aria-hidden=true] { border-color: transparent !important; }
.va .rail { border-right: 1px solid var(--border-hairline); width: 272px; }
.va .rail-in { width: 272px; height: 100%; display: flex; flex-direction: column; min-height: 0; }
.va .rail .rh { padding: 14px 12px 8px; display: grid; gap: 8px; }
.va .rail .rl { flex: 1; overflow: auto; padding: 0 6px 12px; }
.va .dock { border-left: 1px solid var(--border-hairline); width: 320px; }
.va .dock-in { width: 320px; height: 100%; overflow: auto; padding: 14px 16px; display: grid; gap: 18px; align-content: start; font-size: 12px; }
.va .dock section { display: grid; gap: 8px; }
.va .dock h3 { margin: 0; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }
.va .dock .case { display: grid; gap: 2px; padding: 8px 10px; border: 1px solid var(--border-hairline); border-radius: var(--radius-sm); text-align: left; min-height: 0; }
.va .dock .case .ct { display: flex; gap: 8px; align-items: baseline; }
.va .dock .case .ct b { color: var(--accent); }
.va .dock .case small { color: var(--text-muted); }
.va .dock .trace { font-size: 11px; }
.va .dock .src { font-size: 11px; display: flex; gap: 8px; align-items: baseline; text-align: left; min-height: 0; padding: 4px 6px; border: 0; }
.va .dock .src b { color: var(--accent); font-weight: 500; }
.va .dock .src.lit { background: var(--accent-tint-strong); }
.va .composer .status { order: 1; }
.va .chat-head .tog { min-height: 32px; padding: 4px 10px; font-size: 11px; }
@media (max-width: 1180px) { .va .dock { display: none; } }
@media (max-width: 800px) { .va .rail { display: none; } }

/* ---------- variant B · focus ---------- */
.vb-shell { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; }
.vb { max-width: 780px; margin: 0 auto; padding: 0 clamp(12px, 3vw, 24px); display: flex; flex-direction: column; min-height: calc(100dvh - var(--top)); min-width: 0; }
.vb .strip { display: flex; align-items: center; gap: 10px; padding: 14px 0 10px; font-size: 11px; color: var(--text-secondary); position: sticky; top: var(--top); z-index: 10; background: var(--surface-page); }
.vb .strip .crumbs { display: flex; gap: 10px; align-items: center; min-width: 0; }
.vb .strip .crumbs b { color: var(--text-primary); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vb .strip .spacer { flex: 1; }
.vb .transcript { padding: 12px 0 24px; gap: 28px; overflow: visible; }
.vb .msg { max-width: none; }
.vb .msg.fm { border-left: 0; padding-left: 0; }
.vb .msg.fm .body { font: 400 19px/1.55 var(--font-display); color: var(--cream-50); letter-spacing: .005em; }
.vb .msg.fm .cite { font-family: var(--font-mono); vertical-align: 2px; }
.vb .msg.user { border-left: 0; padding: 0; }
.vb .msg.user .body { font-size: 14px; color: var(--text-secondary); }
.vb .msg.user .body::before { content: '› '; color: var(--accent); }
.vb .composer { position: sticky; bottom: 88px; margin: 16px 0 0; border: 1px solid var(--border-strong); border-radius: var(--radius-lg); background: rgba(13, 12, 10, .88); backdrop-filter: blur(12px); box-shadow: 0 20px 60px #000a; padding: 10px 14px 12px; z-index: 15; }
.vb .composer .menu { left: 14px; right: 14px; }
.vb-shell .palette { position: sticky; top: var(--top); height: calc(100dvh - var(--top) - 96px); width: 0; border-right: 1px solid var(--border-hairline); background: var(--surface-sunken); }
.vb .palette-in { width: 360px; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.vb-shell .palette .search { border: 0; border-bottom: 1px solid var(--border-hairline); border-radius: 0; background: transparent; min-height: 52px; padding: 14px 16px; font-size: 14px; }
.vb-shell .palette .pl { overflow: auto; padding: 6px; }
.vb-shell .palette .hist button { padding: 10px 12px; }
.vb-shell .palette .cmd { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border: 0; min-height: 0; border-radius: var(--radius-sm); font-size: 12px; text-align: left; }
.vb-shell .palette .cmd small { color: var(--text-muted); }
.vb-shell .palette .hint { padding: 8px 14px; border-top: 1px solid var(--border-hairline); font-size: 10px; color: var(--text-muted); display: flex; gap: 14px; }
.vb .toolbelt { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }

/* ---------- variant C · workbench ---------- */
.vc { display: grid; grid-template-rows: auto minmax(0, 1fr); height: calc(100dvh - var(--top) - 96px); }
.vc .sessions { display: flex; align-items: stretch; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--border-hairline); overflow-x: auto; scrollbar-width: none; position: relative; }
.vc .sessions button { border: 1px solid transparent; border-bottom: 0; border-radius: var(--radius-sm) var(--radius-sm) 0 0; min-height: 40px; padding: 6px 14px; font-size: 12px; white-space: nowrap; display: flex; gap: 8px; align-items: center; color: var(--text-secondary); }
.vc .sessions button small { color: var(--text-muted); font-size: 10px; }
.vc .sessions button[aria-current=page] { background: var(--surface-panel); border-color: var(--border-hairline); color: var(--text-primary); }
.vc .sessions .tabline { position: absolute; bottom: -1px; height: 2px; background: var(--accent); width: 0; pointer-events: none; }
.vc .sessions .plus { margin-left: 4px; border: 1px dashed var(--border-strong); border-bottom: 0; }
.vc .split { display: grid; grid-template-columns: minmax(0, 1fr) auto; min-height: 0; }
.vc .chat { background: var(--surface-panel); }
.vc .chat-head .tog { min-height: 32px; padding: 4px 10px; font-size: 11px; }
.vc .transcript { padding: 16px; gap: 14px; }
.vc .msg { max-width: none; }
.vc .bench { width: 0; border-left: 1px solid var(--border-hairline); background: var(--surface-page); }
.vc .bench-in { width: 720px; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
.vc .bench .bt .close { margin-left: 4px; min-height: 30px; padding: 0 8px; font-size: 12px; border-color: transparent; }
.vc .bench .bt { display: flex; align-items: center; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--border-hairline); overflow-x: auto; position: relative; min-height: 46px; }
.vc .bench .bt button { border: 1px solid transparent; border-bottom: 0; border-radius: var(--radius-sm) var(--radius-sm) 0 0; min-height: 36px; padding: 4px 12px; font-size: 11px; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
.vc .bench .bt button[aria-selected=true] { background: var(--surface-sunken); border-color: var(--border-hairline); color: var(--text-primary); }
.vc .bench .bt button .x { color: var(--text-muted); font-size: 11px; padding: 0 2px; }
.vc .bench .bt .ticker { margin-left: auto; font-size: 11px; color: var(--accent); display: flex; align-items: center; gap: 8px; padding: 0 6px; white-space: nowrap; }
.vc .bench .bb { overflow: auto; padding: 18px 20px; background: var(--surface-sunken); }
.vc .bench .bb h3 { margin: 0 0 12px; font: 400 24px/1.2 var(--font-display); }
.vc .bench .bb pre { margin: 0; font-size: 12px; line-height: 1.6; white-space: pre-wrap; color: var(--text-secondary); background: var(--surface-terminal); border: 1px solid var(--border-hairline); border-radius: var(--radius-sm); padding: 14px 16px; }
.vc .bench .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.vc .bench .kv { display: grid; gap: 4px; padding: 12px 14px; border: 1px solid var(--border-hairline); border-radius: var(--radius-sm); background: var(--surface-panel); }
.vc .bench .kv label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); }
.vc .bench .kv .v { font-size: 22px; color: var(--text-primary); }
.vc .bench .kv small { color: var(--text-secondary); }
.vc .bench .caselist { display: grid; gap: 6px; margin-top: 14px; }
.vc .bench .caselist button { text-align: left; display: flex; gap: 10px; align-items: baseline; min-height: 40px; }
.vc .bench .caselist button b { color: var(--accent); }
.vc .bench .caselist button small { margin-left: auto; color: var(--text-muted); }
.vc .bench .diff { font-size: 11px; }
